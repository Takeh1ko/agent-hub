<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#1a1d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <!-- logo mark: a hub with spokes -->
  <g transform="translate(205 190)">
    <circle r="150" fill="url(#glow)"/>
    <g stroke="url(#accent)" stroke-width="7" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="0" x2="-92" y2="-70"/>
      <line x1="0" y1="0" x2="98" y2="-58"/>
      <line x1="0" y1="0" x2="-70" y2="92"/>
      <line x1="0" y1="0" x2="88" y2="80"/>
    </g>
    <circle r="46" fill="url(#accent)"/>
    <circle r="20" fill="#0d1020"/>
    <circle cx="-92" cy="-70" r="17" fill="#22d3ee"/>
    <circle cx="98" cy="-58" r="15" fill="#a78bfa"/>
    <circle cx="-70" cy="92" r="14" fill="#a78bfa"/>
    <circle cx="88" cy="80" r="18" fill="#22d3ee"/>
  </g>
  <!-- wordmark -->
  <text x="410" y="185" font-family="Noto Sans, Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-1">agent-hub</text>
  <text x="414" y="243" font-family="Noto Sans, Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#c9cde6">Claude decides. Cheap models do the work.</text>
  <!-- flow -->
  <g font-family="Noto Sans, Inter, Helvetica, Arial, sans-serif" font-size="21">
    <rect x="414" y="300" width="190" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="509" y="333" text-anchor="middle" fill="#e6e8f5">Claude Code</text>
    <path d="M622 326 H644 M636 318 L645 326 L636 334" stroke="#8b8fb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="664" y="300" width="300" height="52" rx="26" fill="url(#accent)" fill-opacity="0.18" stroke="url(#accent)"/>
    <text x="814" y="333" text-anchor="middle" fill="#ffffff">gates · review · budgets</text>
    <path d="M982 326 H1004 M996 318 L1005 326 L996 334" stroke="#8b8fb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1024" y="300" width="200" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="1124" y="333" text-anchor="middle" fill="#e6e8f5">cheap models</text>
  </g>
</svg>
