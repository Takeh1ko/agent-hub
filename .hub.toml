schema_version = 1
name = "agent-hub"
root = "$HOME/Projects/Python/agent-hub"
worktrees = "$HOME/Projects/Python/agent-hub-wt"
rules = "docs/agents/rules.md"
python = "$HOME/Projects/Python/agent-hub/.venv/bin/python"
test_lock = "/tmp/hub-selftest.lock"
work_branch = "main"
push = ""
allowed_paths = ["hub/**", "tests/**", "docs/**", "pyproject.toml", ".hub.toml", ".gitignore"]

[hooks]
task_setup = ""
task_cleanup = ""

[defaults]
executor = "muse"
reviewers = ["muse"]  # решение владельца 2026-09-29: критический путь — Spark код + Spark ревью
budget_go = 0.5
budget_usd = 0.0

[levels]  # easy — рутина Gemini; medium/hard — критический путь, Spark Go; background — не тормозит, бесплатный Spark
easy = "deepseek"
medium = "muse"
hard = "muse"
background = "musefree"

