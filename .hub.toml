schema_version = 2
name = "agent-hub-v3"
worktrees = "/root/Project/ahub-v3-wt"
work_branch = "server-fixes"
python = "/root/Project/ahub-v3/.venv/bin/python"
rules = "docs/agents/ahub_rules.md"
allowed_paths = ["ahub/**", "tests/**", "docs/**", "tools/**", ".github/**", "pyproject.toml", ".hub.toml", ".gitignore", "README.md", "README.ru.md", "LICENSE", "CONTRIBUTING.md", "CHANGELOG.md", "CLAUDE.md"]
max_parallel = 2
test_resource = "selftest"

[resources]
selftest = { lock = "/tmp/hub-selftest.lock", capacity = 2 }  # two tasks at once; acceptance itself still runs one at a time under the lock

[budget]
go = 1.5
usd = 0.0

[secrets]
exclude = []

[tests]
args = ["-n", "6", "--dist", "loadgroup"]  # the suite is xdist-safe (T160): ~3 min instead of ~12
