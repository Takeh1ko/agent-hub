schema_version = 2
name = "agent-hub"
worktrees = "$HOME/Projects/Python/agent-hub-wt"
work_branch = "main"
python = "$HOME/Projects/Python/agent-hub/.venv/bin/python"
rules = "docs/agents/ahub_rules.md"
allowed_paths = ["ahub/**", "tests/**", "docs/**", "tools/**", "pyproject.toml", ".hub.toml", ".gitignore"]
max_parallel = 2
test_resource = "selftest"

[resources]
selftest = { lock = "/tmp/hub-selftest.lock" }

[budget]
go = 1.5
usd = 0.0

[secrets]
exclude = ["ahub/secrets.py"]  # токен бота — не для работников
