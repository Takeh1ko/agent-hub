[project]
name = "ahub"
version = "3.0.0"
description = "Service through which Claude Code and a human hand tasks to cheap worker models and accept the results"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["agents", "orchestrator", "llm", "telegram"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = ["textual>=0.80", "psutil>=5.9; sys_platform != 'linux'"]

[project.urls]
Homepage = "https://github.com/Takeh1ko/agent-hub"
Issues = "https://github.com/Takeh1ko/agent-hub/issues"

[project.optional-dependencies]
telegram = ["aiogram>=3.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "psutil>=5.9", "aiogram>=3.13"]

[project.scripts]
ahub = "ahub.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ahub*"]

[tool.setuptools.package-data]
ahub = ["migrations/*.sql", "claude/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: real providers (cost money), only with AHUB_LIVE=1"]
