[project]
name = "midas-ai-hub"
version = "2.0.0"
description = "agent-hub v2: сервис, через который оркестратор (Claude Code) и человек раздают работу моделям-работникам"
requires-python = ">=3.12"
dependencies = ["textual>=0.80", "aiogram>=3.13", "aiohttp-socks>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
hub = "ahub.cli:main"
ahub = "ahub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ahub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: настоящие поставщики (деньги), только при AHUB_LIVE=1"]
