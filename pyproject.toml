[project]
name = "ahub"
version = "3.1.0"
description = "Service through which Claude Code and a human hand tasks to cheap worker models and accept the results"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["agents", "orchestrator", "llm", "telegram"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = ["textual>=0.80", "psutil>=5.9; sys_platform != 'linux'"]

[project.urls]
Homepage = "https://github.com/Takeh1ko/agent-hub"
Issues = "https://github.com/Takeh1ko/agent-hub/issues"

[project.optional-dependencies]
telegram = ["aiogram>=3.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-xdist>=3", "psutil>=5.9", "aiogram>=3.13", "ruff>=0.6", "build>=1.2"]

[project.scripts]
ahub = "ahub.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ahub*"]

[tool.setuptools.package-data]
ahub = ["migrations/*.sql", "claude/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: real providers (cost money), only with AHUB_LIVE=1"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# One line per message: it is a whole sentence, splitting it would only break the catalog.
"ahub/i18n/en.py" = ["E501"]
"ahub/i18n/ru.py" = ["E501"]
# Prompts are read as text by a worker model; the lines are kept as written.
"ahub/prompts.py" = ["E501"]
