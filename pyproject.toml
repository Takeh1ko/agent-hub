[project]
name = "midas-ai-hub"
version = "0.1.0"
description = "agent-hub: терминальный оркестратор ИИ-агентов (opencode, agy) с TG-пультом"
requires-python = ">=3.12"
dependencies = ["textual>=0.80", "aiogram>=3.13", "aiohttp-socks>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
hub = "hub.cli:main"
ahub = "ahub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hub*", "ahub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
